[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fredrick-trading-bot"
version = "0.1.0"
description = "A paper-trading bot that selects one US stock per market day."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.42.0",
    "python-dotenv>=1.0.1",
    "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[project.scripts]
fredrick-bot = "fredrick_trading_bot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
